name: Secret Scan

# Mirrors the gitleaks workflow mausVoice ships (PR #63), adapted for this repo.
# Runs on PR heads and on push to main so a credential added and removed inside
# a branch gets caught before it reaches main. pull_request (not
# pull_request_target) keeps the scan on the merge commit without granting the
# target repo's secrets to forked code. Least privilege: read-only checkout.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history so the real PR/push commit range can be scanned for
      # secrets that were added and later removed within the branch.
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.0
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
          # Verify the download against the release-published checksums instead
          # of executing an unverified archive as root-installed code.
          curl -sSL --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep " ${ASSET}$" /tmp/gitleaks_checksums.txt > /tmp/gitleaks.sha256
          cd /tmp && sha256sum -c /tmp/gitleaks.sha256
          tar -xzf "/tmp/${ASSET}" -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commit range for secrets
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            -c gitleaks.toml --redact --no-banner

      - name: Scan pushed commit range for secrets
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          gitleaks detect \
            --log-opts="${{ github.event.before }}..${{ github.event.after }}" \
            -c gitleaks.toml --redact --no-banner

      - name: Scan working tree for committed secrets
        run: gitleaks detect --no-git --source . -c gitleaks.toml

      - name: Prove a fake secret is detected
        run: |
          set -euo pipefail
          # A throwaway private-key fixture. The scan must flag it; if it does
          # not, the config is broken and the gate is meaningless.
          printf '-----BEGIN PRIVATE KEY-----\nFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE\n-----END PRIVATE KEY-----' > /tmp/fake-secret.txt
          if gitleaks detect --no-git --source /tmp/fake-secret.txt -c gitleaks.toml; then
            echo "::error::Gitleaks failed to detect a fake private-key fixture" >&2
            exit 1
          fi
          echo "OK: fake private-key fixture was detected."
